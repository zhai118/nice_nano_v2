CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=30
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=70

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
#CONFIG_BT_MAX_PAIRED=4
# 关闭2M PHY，nRF52840 v0.3经常广播异常
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_0=y

CONFIG_BT_MAX_PAIRED=2
CONFIG_ZMK_COMBOS=y

CONFIG_ZMK_BATTERY_REPORTING=y

# 关键！v0.3非常重要：关闭自动深度休眠，电池模式防止直接睡死
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0
CONFIG_SYS_PM_IDLE_STATES=0

# 关闭自动广告BUG修复 v0.3
CONFIG_ZMK_BLE_ADVERTISING_AUTO_START=y
CONFIG_BT_ADV_AUTO_START=y
