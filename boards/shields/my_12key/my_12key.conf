CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=30
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=70

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_BT_MAX_PAIRED=4
# 删除 ZMK_BLE_AUTO_START_ADVERTISING，新版本不再支持该选项
# USB和蓝牙同时可用，关闭互斥
CONFIG_ZMK_USB_BLE_EXCLUSIVE=n
CONFIG_ZMK_BLE_AUTO_PROFILE_ACTIVATE=y

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_NRF_VDDH=y

# 修复Windows Realtek/Intel蓝牙适配器兼容性，关闭2M PHY，很多DIY键盘必须打开这个
CONFIG_BT_CTLR_PHY_2M=n

# 蓝牙广播参数，强制通用可发现广播
CONFIG_BT_GAP_ADV_FAST_INTERVAL_MIN=32
CONFIG_BT_GAP_ADV_FAST_INTERVAL_MAX=48

# 增大射频发射功率 nRF52840：0=0dbm, 1=+4dbm
CONFIG_BT_CTLR_TX_PWR=1
