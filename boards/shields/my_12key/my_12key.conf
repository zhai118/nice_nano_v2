CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=30
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=70

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_BT_MAX_PAIRED=4
# 删除 ZMK_BLE_AUTO_START_ADVERTISING，新版本不再支持该选项
# USB和蓝牙同时可用，关闭互斥（解决USB插上蓝牙被关闭）
CONFIG_ZMK_USB_BLE_EXCLUSIVE=n

# 上电自动激活蓝牙profile0，上电就广播
CONFIG_ZMK_BLE_AUTO_PROFILE_ACTIVATE=y

# 开启电池电量上报（nice!nano v2板载dt已经自带zmk,battery‑nrf‑vddh驱动，不要写ZMK_BATTERY_NRF_VDDH）
CONFIG_ZMK_BATTERY_REPORTING=y

# 修复Windows蓝牙适配器兼容性，关闭BLE 2M PHY（很多Realtek适配器不支持2M）
CONFIG_BT_CTLR_PHY_2M=n

# 蓝牙广播间隔
CONFIG_BT_GAP_ADV_FAST_INTERVAL_MIN=32
CONFIG_BT_GAP_ADV_FAST_INTERVAL_MAX=48

# nRF52840发射功率 +4dbm，新版本语法
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
